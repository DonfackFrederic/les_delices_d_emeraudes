<button
  class="cart-btn"
  [class.cart-btn--has-items]="cart.itemCount() > 0"
  (click)="cart.toggleDrawer()"
  [attr.aria-label]="'Panier (' + cart.itemCount() + ' article' + (cart.itemCount() > 1 ? 's' : '') + ')'"
  aria-haspopup="dialog"
  type="button"
>
  <!-- Icône panier (Tabler Icons inline SVG) -->
  <span class="cart-icon-wrap" [class.bounce]="isBouncing()" aria-hidden="true">
    <svg
      xmlns="http://www.w3.org/2000/svg"
      width="22"
      height="22"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <path stroke="none" d="M0 0h24v24H0z" fill="none"/>
      <path d="M6 19m-2 0a2 2 0 1 0 4 0a2 2 0 1 0 -4 0"/>
      <path d="M17 19m-2 0a2 2 0 1 0 4 0a2 2 0 1 0 -4 0"/>
      <path d="M17 17h-11v-14h-2"/>
      <path d="M6 5l14 1l-1 7h-13"/>
    </svg>

    <!-- Badge -->
    @if (cart.itemCount() > 0) {
      <span class="cart-badge" aria-hidden="true">
        {{ cart.itemCount() > 99 ? '99+' : cart.itemCount() }}
      </span>
    }
  </span>

  <span class="cart-label">Panier</span>
</button>
