@if (store.totalPages() > 1) {
  <nav class="pagination" aria-label="Navigation par page">

    <button class="pagination__btn" type="button"
            (click)="store.prevPage()" [disabled]="store.page() <= 1"
            aria-label="Page précédente">
      <i class="ti ti-chevron-left" aria-hidden="true"></i>
    </button>

    @for (p of pages; track track($index, p)) {
      @if (isDots(p)) {
        <span class="pagination__dots" aria-hidden="true">…</span>
      } @else {
        <button class="pagination__btn"
                [class.pagination__btn--active]="p === store.page()"
                (click)="store.setPage(p)"
                [attr.aria-label]="'Page ' + p"
                [attr.aria-current]="p === store.page() ? 'page' : null"
                type="button">{{ p }}</button>
      }
    }

    <button class="pagination__btn" type="button"
            (click)="store.nextPage()" [disabled]="store.page() >= store.totalPages()"
            aria-label="Page suivante">
      <i class="ti ti-chevron-right" aria-hidden="true"></i>
    </button>

    <p class="pagination__range" aria-live="polite" aria-atomic="true">
      {{ store.rangeFrom() }}–{{ store.rangeTo() }} sur {{ store.total() }}
    </p>

  </nav>
}
