<section class="featured" aria-labelledby="featured-title">
  <div class="featured__header">
    <div>
      <p class="section-eyebrow">Nos créations</p>
      <h2 class="section-title" id="featured-title">Produits en vedette</h2>
      <p class="section-sub">Découvrez nos pâtisseries les plus appréciées, réalisées avec soin.</p>
    </div>
    <a routerLink="/products" class="featured__link-all">
      Tout voir
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
        <path d="M3 8h10M9 4l4 4-4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </a>
  </div>

   <!-- Grille de produits -->
  <app-products-grid
    [products]="products()"
    [loading]="loading()"
    [error]="error()"
    [skeletonCount]="pageSize()"
    (addToCart)="onAddToCart($event)"
  />
  
</section>
