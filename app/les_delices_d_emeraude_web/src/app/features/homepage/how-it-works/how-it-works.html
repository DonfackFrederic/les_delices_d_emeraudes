<section class="hiw" aria-labelledby="hiw-title">
  <p class="section-eyebrow">Simple & rapide</p>
  <h2 class="section-title" id="hiw-title">Comment ça fonctionne</h2>
  <p class="section-sub">Trois étapes pour recevoir vos douceurs personnalisées.</p>

  <div class="hiw__steps">
    @for (step of steps; track step.number) {
      <div class="hiw__step">
        <div class="hiw__icon-wrap" [attr.aria-label]="'Étape ' + step.number">
          <div class="hiw__icon">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path [attr.d]="step.icon" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
          <span class="hiw__number" aria-hidden="true">{{ step.number }}</span>
        </div>

        <div class="hiw__body">
          <h3 class="hiw__title">{{ step.title }}</h3>
          <p class="hiw__desc">{{ step.description }}</p>
        </div>
      </div>

      @if (step.number < steps.length) {
        <div class="hiw__connector" aria-hidden="true">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
            <path d="M5 12h14M14 7l5 5-5 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
      }
    }
  </div>
</section>
